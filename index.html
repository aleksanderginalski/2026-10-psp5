<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a0f0a">
<title>Gejowski Gambit 2026 — plan dnia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0f0a;
    --panel: rgba(26, 15, 10, .82);
    --rust: #c4501e;
    --sand: #e8c48a;
    --muted: #b8966e;
    --shade: 26, 15, 10;
    --btn: rgba(42, 24, 16, .9);
    --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  }
  /* Per-day palette, picked by "motyw" in plan.json. Default above = "pustkowie" (rust). */
  :root[data-motyw="noc"] {
    --bg: #0d1320;
    --panel: rgba(13, 19, 32, .82);
    --rust: #f39a1e;
    --sand: #efe4cf;
    --muted: #8c9cb5;
    --shade: 13, 19, 32;
    --btn: rgba(22, 32, 52, .9);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); height: 100%; }
  body { margin: 0; color: var(--sand); }
  /* The page is a fixed frame: name and day tabs on top, the scene at the bottom — only the plan scrolls. */
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Background art sits behind everything; the gradient keeps text legible on any image. */
  /* Starts below the header (top set from JS) so the scene at the top of the art stays visible. */
  #bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
    background: var(--bg) center / cover no-repeat;
  }
  /* Behind the logo: the same art mirrored upward, blurred and dimmed — one picture with no seam, and the
     scene at the top of the art still shows below the tabs. It overlaps the art by 12px and fades out there. */
  #bg::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: calc(100% - 12px); height: 100%;
    background: inherit; transform: scaleY(-1); filter: blur(3px) brightness(.55);
    -webkit-mask-image: linear-gradient(transparent, #000 12px); mask-image: linear-gradient(transparent, #000 12px);
  }
  #bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(var(--shade), .15), rgba(var(--shade), .3) 50%, rgba(var(--shade), .15));
  }
  header {
    flex: none; position: relative; z-index: 1;
    padding: 12px 16px 8px;
  }
  h1 {
    margin: 0;
    font: 400 1.75rem/1 var(--display);
    letter-spacing: .12em;
    color: var(--rust);
    text-align: center;
  }
  /* The name as a picture (per day, "logo" in plan.json); the text stays as its alt and as a fallback. */
  #logo { display: block; margin: 0 auto; max-width: 100%; height: 64px; object-fit: contain; }   /* same height both days: nothing jumps */
  #logo[hidden] { display: none; }
  /* Day tabs right under the logo, on the artwork; below them a window onto
     the scene at the top of the art, then the plan. */
  nav {
    flex: none; display: flex; gap: 8px; position: relative; z-index: 2;
    width: 100%; max-width: 640px; margin: 4px auto max(16px, 15vh); padding: 0 16px;
  }
  nav button {
    flex: 1;
    padding: 5px 8px;
    font: 400 1.2rem/1.1 var(--display);
    letter-spacing: .06em;
    color: var(--sand);
    background: rgba(var(--shade), .78);
    border: 2px solid var(--muted);
    border-radius: 6px;
    cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--rust); border-color: var(--rust); color: var(--bg); }
  nav button small { margin-left: 6px; font: 400 .8rem/1 system-ui, sans-serif; letter-spacing: 0; opacity: .85; }
  /* The only scrolling part; its edges fade so items slide out softly under the tabs and above the scene. */
  main {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    width: 100%; max-width: 640px; margin: 0 auto; padding: 10px 16px 14px;
    -webkit-mask-image: linear-gradient(transparent, #000 10px, #000 calc(100% - 14px), transparent);
    mask-image: linear-gradient(transparent, #000 10px, #000 calc(100% - 14px), transparent);
  }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: grid;
    grid-template-columns: 5.2rem 1fr;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--panel);
    border-left: 4px solid var(--muted);
    border-radius: 6px;
  }
  li.past { opacity: .5; }
  li.now { border-left-color: var(--rust); outline: 2px solid var(--rust); }
  .time { font: 400 2rem/1 var(--display); color: var(--rust); letter-spacing: .04em; }
  .what { font-size: 1.15rem; font-weight: 700; line-height: 1.25; }
  .where { font-size: .9rem; color: var(--muted); margin-top: 2px; }
  .tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: var(--rust); color: #fff; border-radius: 3px; vertical-align: middle;
  }
  .empty { text-align: center; padding: 48px 16px; background: var(--panel); border-radius: 6px; color: var(--muted); font-size: 1.2rem; }
  /* Tap-to-hype pixel scene (scena.js) at the bottom of the frame. manipulation = rapid taps don't zoom. */
  #scena {
    flex: none; position: relative; z-index: 1;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; cursor: pointer;
  }
  #scena canvas {
    display: block; margin: 0 auto; background: var(--bg);
    border: 2px solid var(--rust); border-radius: 6px;
    image-rendering: crisp-edges; image-rendering: pixelated;
  }
</style>
</head>
<body>
<div id="bg"></div>
<header>
  <h1><img id="logo" alt="" hidden><span id="title">Gejowski Gambit 2026</span></h1>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="plan"><div class="empty">Ładowanie planu…</div></main>
<footer id="scena" hidden><canvas aria-hidden="true"></canvas></footer>
<script>
  function fitBg() { document.getElementById('bg').style.top = document.querySelector('header').offsetHeight + 'px'; }
  window.addEventListener('resize', fitBg);

  function pad(n) { return String(n).padStart(2, '0'); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  var now = new Date();
  var today = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  var clock = pad(now.getHours()) + ':' + pad(now.getMinutes());
  var v = Date.now(); // cache-bust so edits to plan.json / backgrounds show up immediately

  // The footer scene lives in its own file, so a bug there can't take the plan down.
  var sc = document.createElement('script');
  sc.src = 'scena.js?v=' + v;
  document.body.appendChild(sc);

  fetch('plan.json?v=' + v)
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () {
      document.getElementById('plan').innerHTML = '<div class="empty">Nie udało się wczytać planu. Odśwież stronę.</div>';
    });

  function render(plan) {
    document.getElementById('title').textContent = plan.tytul || 'Gejowski Gambit 2026';
    var tabs = document.getElementById('tabs');
    var dni = plan.dni || [];

    dni.forEach(function (dzien, i) {
      var b = document.createElement('button');
      b.setAttribute('role', 'tab');
      var dt = dzien.data.split('-');
      b.innerHTML = esc(dzien.nazwa) + '<small>' + (+dt[2]) + '.' + dt[1] + '</small>';
      b.addEventListener('click', function () { show(i); });
      tabs.appendChild(b);
    });

    function show(i) {
      var dzien = dni[i];
      Array.prototype.forEach.call(tabs.children, function (b, j) { b.setAttribute('aria-selected', i === j); });
      document.getElementById('scena').dzien = dzien;   // the footer scene draws its shouts from the shown day
      document.documentElement.dataset.motyw = dzien.motyw || '';
      document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      document.getElementById('bg').style.backgroundImage = dzien.tlo ? 'url("' + dzien.tlo + '?v=' + v + '")' : '';
      var logo = document.getElementById('logo'), title = document.getElementById('title');
      logo.hidden = !dzien.logo; title.hidden = !!dzien.logo;
      if (dzien.logo) { logo.alt = title.textContent; logo.onload = fitBg; logo.src = dzien.logo + '?v=' + v; }

      var punkty = (dzien.punkty || []).slice().sort(function (a, b) { return a.godzina < b.godzina ? -1 : 1; });
      if (!punkty.length) {
        document.getElementById('plan').innerHTML = '<div class="empty">Plan na ' + esc(dzien.nazwa).toLowerCase() + ' wkrótce</div>';
        return;
      }
      // On the day itself: dim finished items, mark the one in progress as "teraz".
      var isToday = dzien.data === today;
      var current = -1;
      if (isToday) punkty.forEach(function (p, k) { if (p.godzina <= clock) current = k; });

      document.getElementById('plan').innerHTML = '<ol>' + punkty.map(function (p, k) {
        var cls = !isToday ? '' : k < current ? 'past' : k === current ? 'now' : '';
        return '<li class="' + cls + '"><span class="time">' + esc(p.godzina) + '</span><div>' +
          '<div class="what">' + esc(p.co) + (cls === 'now' ? '<span class="tag">teraz</span>' : '') + '</div>' +
          (p.gdzie ? '<div class="where">' + esc(p.gdzie) + '</div>' : '') + '</div></li>';
      }).join('') + '</ol>';
      // The list scrolls on its own: start at the top, or at what's on right now.
      var list = document.getElementById('plan'), live = list.querySelector('li.now');
      list.scrollTop = 0;
      if (live) live.scrollIntoView({ block: 'center' });
      fitBg();
    }

    // A day-specific link (#piatek, #sobota — from per-day QR codes) wins;
    // otherwise today's plan by local date: before the trip -> first day, after -> last day.
    var hash = slug(decodeURIComponent(location.hash.slice(1)));
    var pick = -1;
    dni.forEach(function (d, i) { if (slug(d.nazwa) === hash) pick = i; });
    if (pick < 0) {
      pick = 0;
      dni.forEach(function (d, i) { if (d.data <= today) pick = i; });
    }
    show(pick);
    fitBg();
  }

  // Scanning the other day's QR in an already-open tab only changes the hash.
  window.addEventListener('hashchange', function () { location.reload(); });

  function slug(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
  }
</script>
</body>
</html>
