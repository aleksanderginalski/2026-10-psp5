<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a0f0a">
<title>PSP5 — plan dnia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0f0a;
    --panel: rgba(26, 15, 10, .82);
    --rust: #c4501e;
    --sand: #e8c48a;
    --muted: #b8966e;
    --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--sand); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  /* Background art sits behind everything; the gradient keeps text legible on any image. */
  /* Starts below the header (top set from JS) so the scene at the top of the art stays visible. */
  #bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
    background: var(--bg) center / cover no-repeat;
  }
  #bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(26,15,10,.15), rgba(26,15,10,.3) 50%, rgba(26,15,10,.15));
  }
  header {
    position: sticky; top: 0; z-index: 1;
    padding: 12px 16px 10px;
    background: var(--bg);
    border-bottom: 2px solid var(--rust);
  }
  h1 {
    margin: 0 0 8px;
    font: 400 1.6rem/1 var(--display);
    letter-spacing: .12em;
    color: var(--rust);
  }
  nav { display: flex; gap: 8px; }
  nav button {
    flex: 1;
    padding: 10px 8px;
    font: 400 1.35rem/1.1 var(--display);
    letter-spacing: .06em;
    color: var(--sand);
    background: rgba(42, 24, 16, .9);
    border: 2px solid var(--muted);
    border-radius: 6px;
    cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--rust); border-color: var(--rust); color: #fff; }
  nav button small { display: block; font: 400 .85rem/1.3 system-ui, sans-serif; letter-spacing: 0; opacity: .85; }
  /* Leave the top of the artwork (the scene) visible above the list. */
  main { padding: max(16px, 16vh) 16px 32px; max-width: 640px; margin: 0 auto; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: grid;
    grid-template-columns: 5.2rem 1fr;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--panel);
    border-left: 4px solid var(--muted);
    border-radius: 6px;
  }
  li.past { opacity: .5; }
  li.now { border-left-color: var(--rust); outline: 2px solid var(--rust); }
  .time { font: 400 2rem/1 var(--display); color: var(--rust); letter-spacing: .04em; }
  .what { font-size: 1.15rem; font-weight: 700; line-height: 1.25; }
  .where { font-size: .9rem; color: var(--muted); margin-top: 2px; }
  .tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: var(--rust); color: #fff; border-radius: 3px; vertical-align: middle;
  }
  .empty { text-align: center; padding: 48px 16px; background: var(--panel); border-radius: 6px; color: var(--muted); font-size: 1.2rem; }
</style>
</head>
<body>
<div id="bg"></div>
<header>
  <h1 id="title">PSP5 · Plan dnia</h1>
  <nav role="tablist" id="tabs"></nav>
</header>
<main id="plan"><div class="empty">Ładowanie planu…</div></main>
<script>
  function fitBg() { document.getElementById('bg').style.top = document.querySelector('header').offsetHeight + 'px'; }
  window.addEventListener('resize', fitBg);

  function pad(n) { return String(n).padStart(2, '0'); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  var now = new Date();
  var today = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  var clock = pad(now.getHours()) + ':' + pad(now.getMinutes());
  var v = Date.now(); // cache-bust so edits to plan.json / backgrounds show up immediately

  fetch('plan.json?v=' + v)
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () {
      document.getElementById('plan').innerHTML = '<div class="empty">Nie udało się wczytać planu. Odśwież stronę.</div>';
    });

  function render(plan) {
    document.getElementById('title').textContent = (plan.tytul || 'PSP5') + ' · Plan dnia';
    var tabs = document.getElementById('tabs');
    var dni = plan.dni || [];

    dni.forEach(function (dzien, i) {
      var b = document.createElement('button');
      b.setAttribute('role', 'tab');
      var dt = dzien.data.split('-');
      b.innerHTML = esc(dzien.nazwa) + '<small>' + (+dt[2]) + '.' + dt[1] + '</small>';
      b.addEventListener('click', function () { show(i); });
      tabs.appendChild(b);
    });

    function show(i) {
      var dzien = dni[i];
      Array.prototype.forEach.call(tabs.children, function (b, j) { b.setAttribute('aria-selected', i === j); });
      document.getElementById('bg').style.backgroundImage = dzien.tlo ? 'url("' + dzien.tlo + '?v=' + v + '")' : '';

      var punkty = (dzien.punkty || []).slice().sort(function (a, b) { return a.godzina < b.godzina ? -1 : 1; });
      if (!punkty.length) {
        document.getElementById('plan').innerHTML = '<div class="empty">Plan na ' + esc(dzien.nazwa).toLowerCase() + ' wkrótce</div>';
        return;
      }
      // On the day itself: dim finished items, mark the one in progress as "teraz".
      var isToday = dzien.data === today;
      var current = -1;
      if (isToday) punkty.forEach(function (p, k) { if (p.godzina <= clock) current = k; });

      document.getElementById('plan').innerHTML = '<ol>' + punkty.map(function (p, k) {
        var cls = !isToday ? '' : k < current ? 'past' : k === current ? 'now' : '';
        return '<li class="' + cls + '"><span class="time">' + esc(p.godzina) + '</span><div>' +
          '<div class="what">' + esc(p.co) + (cls === 'now' ? '<span class="tag">teraz</span>' : '') + '</div>' +
          (p.gdzie ? '<div class="where">' + esc(p.gdzie) + '</div>' : '') + '</div></li>';
      }).join('') + '</ol>';
    }

    // A day-specific link (#piatek, #sobota — from per-day QR codes) wins;
    // otherwise today's plan by local date: before the trip -> first day, after -> last day.
    var hash = slug(decodeURIComponent(location.hash.slice(1)));
    var pick = -1;
    dni.forEach(function (d, i) { if (slug(d.nazwa) === hash) pick = i; });
    if (pick < 0) {
      pick = 0;
      dni.forEach(function (d, i) { if (d.data <= today) pick = i; });
    }
    show(pick);
    fitBg();
  }

  // Scanning the other day's QR in an already-open tab only changes the hash.
  window.addEventListener('hashchange', function () { location.reload(); });

  function slug(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
  }
</script>
</body>
</html>
